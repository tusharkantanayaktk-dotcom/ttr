<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" fill="none">
  <defs>
    <!-- Purple → Blue gradient (left ribbon / top-bar back layer) -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6D28D9"/>
      <stop offset="50%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <!-- Cyan gradient (top-bar front layer) -->
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- Stem gradient -->
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- Stem inner fold -->
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <!-- Cart gradient -->
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#93C5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- ─────────────── TOP BAR — back ribbon (purple→blue, left side) ─────────────── -->
  <path d="
    M 18,100
    L 45,38
    C 50,28 60,24 72,24
    L 148,24
    C 136,24 126,34 124,46
    L 120,68
    C 118,56 108,48 96,50
    L 36,88
    C 26,92 18,98 18,100 Z
  " fill="url(#g1)" opacity="0.95"/>

  <!-- ─────────────── TOP BAR — front ribbon (blue→cyan, right side) ─────────────── -->
  <path d="
    M 124,24
    L 228,24
    C 240,24 246,32 244,44
    L 238,72
    C 240,60 232,52 220,52
    L 138,52
    C 126,52 122,44 124,34
    Z
  " fill="url(#g2)" opacity="0.95"/>

  <!-- ─────────────── TOP BAR — fold overlap at center ─────────────── -->
  <path d="
    M 124,24 L 142,24
    C 136,24 130,30 128,38
    L 126,50
    C 124,42 122,34 124,28 Z
  " fill="#1E88E5" opacity="0.5"/>

  <!-- ─────────────── STEM — back-left ribbon ─────────────── -->
  <path d="
    M 88,62
    C 88,50 96,44 106,46
    L 102,196
    C 92,196 86,188 86,178 Z
  " fill="url(#g1)" opacity="0.88"/>

  <!-- ─────────────── STEM — front-right ribbon ─────────────── -->
  <path d="
    M 106,46
    C 118,46 128,56 128,68
    L 126,186
    C 126,194 120,198 112,198
    C 106,198 102,194 102,188
    L 102,196
    Z
  " fill="url(#g3)" opacity="0.92"/>

  <!-- ─────────────── STEM — inner swirl highlight ─────────────── -->
  <path d="
    M 106,46
    C 112,48 120,56 118,66
    L 114,148
    C 110,136 104,124 100,116
    L 102,66
    C 102,54 104,46 106,46 Z
  " fill="url(#g4)" opacity="0.38"/>

  <!-- ─────────────── SHOPPING CART ─────────────── -->
  <!-- Cart handle/pole -->
  <path d="M 172,92 L 184,92 L 200,144" 
    stroke="url(#g5)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Cart shelf 1 (top, widest) -->
  <rect x="184" y="104" width="60" height="11" rx="4" fill="url(#g5)" opacity="0.9"/>
  <!-- Cart shelf 2 (middle) -->
  <rect x="186" y="121" width="54" height="10" rx="4" fill="url(#g5)" opacity="0.75"/>
  <!-- Cart shelf 3 (bottom, narrowest) -->
  <rect x="190" y="137" width="46" height="9" rx="4" fill="url(#g5)" opacity="0.6"/>

  <!-- Cart bottom bar -->
  <path d="M 190,150 L 236,150" stroke="url(#g5)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Wheel left -->
  <circle cx="200" cy="164" r="9" fill="white" opacity="0.85"/>
  <circle cx="200" cy="164" r="5" fill="#BAE6FD" opacity="0.6"/>
  <!-- Wheel right -->
  <circle cx="228" cy="164" r="9" fill="white" opacity="0.85"/>
  <circle cx="228" cy="164" r="5" fill="#BAE6FD" opacity="0.6"/>
</svg>