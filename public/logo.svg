<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Gradients -->
    <!-- Left Wing Gradient: Electric Cyan to Azure -->
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Right Wing Gradient: Electric Azure to Cyber Violet -->
    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Center T-Stem Prism (Deep Diamond Core) -->
    <linearGradient id="centerPrismLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="centerPrismRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Top Crown Bar -->
    <linearGradient id="topCrown" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Ambient Luxury Glow Filter -->
    <filter id="luxuryGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#00F5FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Monogram -->
  <g filter="url(#luxuryGlow)" opacity="0.4">
    <path d="M 96 128 L 416 128 L 336 224 L 288 224 L 288 384 L 256 432 L 224 384 L 224 224 L 176 224 Z" 
          fill="url(#topCrown)" />
  </g>

  <!-- ================= MASTER APEX "T" GAMING EMBLEM ================= -->
  <g filter="url(#softDrop)">

    <!-- 1. LEFT WING (Aerodynamic Controller / "T" Arm) -->
    <polygon points="76,136 244,136 216,216 144,216 120,296 60,196" 
             fill="url(#leftWing)" />

    <!-- 2. RIGHT WING (Symmetrical Power Arm) -->
    <polygon points="436,136 268,136 296,216 368,216 392,296 452,196" 
             fill="url(#rightWing)" />

    <!-- 3. TOP CROWN BEVEL (Ultra-Crisp Specular Rim) -->
    <polygon points="76,136 256,152 436,136 416,120 256,132 96,120" 
             fill="url(#topCrown)" />

    <!-- 4. CENTER VERTICAL PRISM - LEFT FACET (Diamond T-Stem) -->
    <polygon points="256,152 256,436 216,368 216,216 244,136" 
             fill="url(#centerPrismLeft)" />

    <!-- 5. CENTER VERTICAL PRISM - RIGHT FACET -->
    <polygon points="256,152 256,436 296,368 296,216 268,136" 
             fill="url(#centerPrismRight)" />

    <!-- 6. INNER DIAMOND POWER CORE (Gaming Top-up Energy Nexus) -->
    <!-- Outer Rim -->
    <polygon points="256,180 292,232 256,284 220,232" 
             fill="#060C1A" 
             stroke="#FFFFFF" 
             stroke-width="3" />

    <!-- Radiant Cyan Core -->
    <polygon points="256,188 284,232 256,276 228,232" 
             fill="url(#topCrown)" />

    <!-- Power Lightning Bolt in Center -->
    <path d="M 258 206 L 247 229 L 255 229 L 254 258 L 265 227 L 257 227 Z" 
          fill="#FFFFFF" />

    <!-- 7. PRECISION SPECULAR EDGE HIGHLIGHTS (Luxury Finish) -->
    <!-- Center Crease Highlight -->
    <line x1="256" y1="152" x2="256" y2="436" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Wing Upper Accent Lines -->
    <line x1="76" y1="136" x2="244" y2="136" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="436" y1="136" x2="268" y2="136" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />

    <!-- Wing Tip Aerodynamic Cuts -->
    <line x1="60" y1="196" x2="120" y2="296" stroke="#00F5FF" stroke-width="2" opacity="0.7" />
    <line x1="452" y1="196" x2="392" y2="296" stroke="#C084FC" stroke-width="2" opacity="0.7" />

    <!-- Bottom Apex Crystal Point -->
    <circle cx="256" cy="436" r="4.5" fill="#FFFFFF" />
    <circle cx="256" cy="436" r="8" fill="#00F5FF" opacity="0.4" />
  </g>
</svg>