<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Realistic Luxury Cyber Gradients -->
    <!-- Primary Cyan-to-Blue Blade Gradient -->
    <linearGradient id="bladeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="50%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0055D4" />
    </linearGradient>

    <!-- Primary Purple-to-Indigo Blade Gradient -->
    <linearGradient id="bladeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Center Core Shard Gradient -->
    <linearGradient id="coreShard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#00F2FE" />
      <stop offset="80%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Titanium Specular Rim Gradient -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="realGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="realShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00F2FE" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Luxury Back-Glow -->
  <g filter="url(#realGlow)" opacity="0.35">
    <path d="M 80 130 L 432 130 L 320 250 L 256 420 L 192 250 Z" fill="url(#bladeLeft)" />
  </g>

  <!-- ================= MASTER ICONIC "T" EMBLEM ================= -->
  <g filter="url(#realShadow)">
    
    <!-- LEFT WING BLADE (Precision chamfered wing) -->
    <path d="M 84 140 L 236 140 L 204 260 L 128 260 L 84 140 Z" 
          fill="url(#bladeLeft)" />

    <!-- RIGHT WING BLADE (Symmetrical power wing) -->
    <path d="M 428 140 L 276 140 L 308 260 L 384 260 L 428 140 Z" 
          fill="url(#bladeRight)" />

    <!-- CENTER VERTICAL DIAMOND CORE SHARD (The T-stem & top-up crystal) -->
    <path d="M 226 140 L 286 140 L 302 248 L 256 424 L 210 248 Z" 
          fill="url(#coreShard)" />

    <!-- TOP AERODYNAMIC CHROME BEVEL (Crisp upper brow) -->
    <path d="M 84 140 L 256 120 L 428 140 L 412 128 L 256 112 L 100 128 Z" 
          fill="url(#specularRim)" />

    <!-- INNER DIAMOND TOP-UP FACET (Negative/Positive gaming crystal cut) -->
    <polygon points="256,150 282,216 256,276 230,216" 
             fill="#080E1E" 
             stroke="#FFFFFF" 
             stroke-width="2.5" />

    <polygon points="256,158 274,216 256,268 238,216" 
             fill="url(#specularRim)" />

    <!-- SPECULAR CHROME EDGE HIGHLIGHTS -->
    <!-- Center spine highlight -->
    <line x1="256" y1="120" x2="256" y2="424" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    
    <!-- Left Wing Upper Rim -->
    <line x1="84" y1="140" x2="236" y2="140" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    
    <!-- Right Wing Upper Rim -->
    <line x1="276" y1="140" x2="428" y2="140" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

    <!-- Apex Point Sparkle -->
    <circle cx="256" cy="424" r="3.5" fill="#FFFFFF" />
  </g>
</svg>